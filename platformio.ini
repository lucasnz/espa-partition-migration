[platformio]
default_envs = migrator, bridge

[env]
platform = https://github.com/pioarduino/platform-espressif32.git#55.03.312-1
board = esp32-c6-devkitc-1
framework = arduino
board_build.flash_size = 8MB
monitor_speed = 115200
lib_deps =
    https://github.com/lucasnz/RemoteDebug.git

; Generate a C header containing the vendor-generated default_8MB partition table.
extra_scripts = pre:scripts/generate_partition_header.py

build_flags =
    -DCORE_DEBUG_LEVEL=3
    -DMIGRATION_FALLBACK_AP_PASSWORD=\"eSPA-Password\"

[env:migrator]
; This build is installed by the existing espa-v2 firmware using its normal U_FLASH OTA endpoint.
board_build.partitions = partitions/espa-v2.csv

[env:bridge]
; Same source code, but this build's companion partition table is the new layout.
; The application binary is staged at 0x340000 by the migrator.
board_build.partitions = partitions/default_8MB.csv
